<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>レンジ＆レンジメート 調理ナビ</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div id="root"></div>

    <script type="text/babel">
        // --- 調理データ設定（後からここを書き換えて調整・追加できます） ---
        const COOKING_DATA = {
            microwave: [
                { id: 'rice', category: 'warm', name: 'ごはん（冷凍・冷蔵）', unit: '杯', defaultQty: 1, step: 1, options: [
                    { qty: 1, watt: '600W', time: '1分40秒', note: 'ラップをふんわりかけてあたためてください。' },
                    { qty: 2, watt: '600W', time: '3分00秒', note: '途中で一度ほぐすとムラなくあたたまります。' }
                ]},
                { id: 'side', category: 'warm', name: '冷蔵おかず', unit: '皿', defaultQty: 1, step: 1, options: [
                    { qty: 1, watt: '600W', time: '1分00秒', note: '平皿に移し、ラップをかけてください。' },
                    { qty: 2, watt: '600W', time: '1分50秒', note: '量に応じて時間を調整してください。' }
                ]},
                { id: 'leafy', category: 'vegetable', name: '葉茎菜（キャベツ・ほうれん草）', unit: 'g', defaultQty: 100, step: 100, options: [
                    { qty: 100, watt: '600W', time: '1分30秒', note: '洗った水気を残したままラップに包んで加熱。' },
                    { qty: 200, watt: '600W', time: '2分40秒', note: '加熱後すぐに水にさらすと色が出ます。' }
                ]},
                { id: 'root', category: 'vegetable', name: '根菜（にんじん・じゃがいも）', unit: 'g', defaultQty: 100, step: 100, options: [
                    { qty: 100, watt: '600W', time: '2分10秒', note: '小さめの一口大に切り、少し水をふりかけてラップ。' },
                    { qty: 200, watt: '600W', time: '3分50秒', note: '竹串がすっと通るまで様子を見てください。' }
                ]},
                { id: 'meat_thaw', category: 'thaw', name: '薄切り肉（解凍）', unit: 'g', defaultQty: 100, step: 100, options: [
                    { qty: 100, watt: '微弱(150W)', time: '2分00秒', note: 'NE-BS8Dの「解凍」モードまたは低ワット推奨。発泡スチロールからは出す。' },
                    { qty: 200, watt: '微弱(150W)', time: '3分30秒', note: '途中で上下を裏返すと均一に解凍できます。' }
                ]}
            ],
            rangemate: [
                { id: 'egg', category: 'cook', name: '目玉焼き', unit: '個', defaultQty: 1, step: 1, options: [
                    { qty: 1, watt: '600W', time: '4分00秒', note: '蓋をして加熱。卵の黄身に必ず数箇所穴を開けてください。' },
                    { qty: 2, watt: '600W', time: '4分30秒', note: '白身が固まるまで様子を見て調整してください。' }
                ]},
                { id: 'salmon', category: 'cook', name: '鮭の塩焼き（生）', unit: '切れ', defaultQty: 1, step: 1, options: [
                    { qty: 1, watt: '600W', time: '4分00秒', note: '皮目を下にして蓋をして加熱。焼き目をつけたい場合は、裏返して＋1分。' },
                    { qty: 2, watt: '600W', time: '4分30秒', note: '魚の厚みによって時間を微調整してください。' }
                ]},
                { id: 'chicken', category: 'cook', name: '鶏もも肉のステーキ', unit: '枚(約250g)', defaultQty: 1, step: 1, options: [
                    { qty: 1, watt: '600W', time: '6分00秒', note: '皮目を下にして蓋をして加熱。裏返してさらに2分加熱すると両面こんがり。' }
                ]}
            ]
        };

        const CATEGORIES = {
            warm: 'あたため',
            vegetable: 'ゆで野菜',
            thaw: '解凍',
            cook: 'レンジメート調理'
        };

        function App() {
            const [mode, setMode] = React.useState('microwave'); // microwave or rangemate
            const [selectedCategory, setSelectedCategory] = React.useState('');
            const [selectedIngredient, setSelectedIngredient] = React.useState(null);
            const [quantity, setQuantity] = React.useState(1);

            // モードが切り替わったら選択状態をリセット
            React.useEffect(() => {
                const availableIngredients = COOKING_DATA[mode];
                if (availableIngredients.length > 0) {
                    setSelectedCategory(availableIngredients[0].category);
                    setSelectedIngredient(availableIngredients[0]);
                    setQuantity(availableIngredients[0].defaultQty);
                }
            }, [mode]);

            // カテゴリが切り替わったら、そのカテゴリの先頭の食材を選択
            const handleCategoryChange = (cat) => {
                setSelectedCategory(cat);
                const firstIng = COOKING_DATA[mode].find(i => i.category === cat);
                if (firstIng) {
                    setSelectedIngredient(firstIng);
                    setQuantity(firstIng.defaultQty);
                }
            };

            // 食材が切り替わったら分量をリセット
            const handleIngredientChange = (ingId) => {
                const ing = COOKING_DATA[mode].find(i => i.id === ingId);
                if (ing) {
                    setSelectedIngredient(ing);
                    setQuantity(ing.defaultQty);
                }
            };

            // 現在の選択に合致する調理結果を取得
            const getResult = () => {
                if (!selectedIngredient) return null;
                // ぴったり一致する分量を探す、なければ一番近いものを探す
                const match = selectedIngredient.options.find(o => o.qty === quantity);
                if (match) return match;
                
                // 簡易的な比例計算（データがない場合の上限・下限対応）
                const sorted = [...selectedIngredient.options].sort((a, b) => a.qty - b.qty);
                if (quantity <= sorted[0].qty) return sorted[0];
                return sorted[sorted.length - 1]; // 最大のデータを返す
            };

            const result = getResult();
            const availableIngredients = COOKING_DATA[mode].filter(i => i.category === selectedCategory);
            const uniqueCategories = [...new Set(COOKING_DATA[mode].map(i => i.category))];

            return (
                <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between pb-8">
                    <div>
                        <header class="bg-blue-600 text-white px-4 py-5 pt-8 text-center shadow-md">
                            <h1 class="text-xl font-bold tracking-wider">キッチンの加熱目安ナビ</h1>
                            <p class="text-xs text-blue-100 mt-1">NE-BS8D & レンジメートプロ対応</p>
                        </header>

                        <div class="flex border-b border-slate-200">
                            <button 
                                onClick={() => setMode('microwave')}
                                class={`flex-1 py-4 text-center font-medium border-b-2 transition-all ${mode === 'microwave' ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-transparent text-slate-500'}`}
                            >
                                皿・通常レンジ
                            </button>
                            <button 
                                onClick={() => setMode('rangemate')}
                                class={`flex-1 py-4 text-center font-medium border-b-2 transition-all ${mode === 'rangemate' ? 'border-orange-500 text-orange-600 bg-orange-50/50' : 'border-transparent text-slate-500'}`}
                            >
                                レンジメートプロ
                            </button>
                        </div>

                        <div class="p-4 space-y-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">1. カテゴリ</label>
                                <div class="grid grid-cols-2 gap-2">
                                    {uniqueCategories.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => handleCategoryChange(cat)}
                                            class={`p-3 text-sm rounded-xl border text-center transition-all font-medium ${selectedCategory === cat ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 active:bg-slate-100'}`}
                                        >
                                            {CATEGORIES[cat]}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {availableIngredients.length > 0 && (
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">2. 食材 / 料理名</label>
                                    <select 
                                        value={selectedIngredient?.id || ''} 
                                        onChange={(e) => handleIngredientChange(e.target.value)}
                                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        {availableIngredients.map(ing => (
                                            <option key={ing.id} value={ing.id}>{ing.name}</option>
                                        ))}
                                    </select>
                                </div>
                            )}

                            {selectedIngredient && (
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">3. おおよその量</label>
                                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <button 
                                            onClick={() => setQuantity(q => Math.max(selectedIngredient.step, q - selectedIngredient.step))}
                                            class="w-12 h-12 bg-white rounded-lg border border-slate-200 flex items-center justify-center text-xl font-bold active:bg-slate-100 shadow-sm select-none"
                                        >
                                            －
                                        </button>
                                        <div class="text-center">
                                            <span class="text-2xl font-bold text-slate-800">{quantity}</span>
                                            <span class="text-sm text-slate-500 ml-1">{selectedIngredient.unit}</span>
                                        </div>
                                        <button 
                                            onClick={() => setQuantity(q => q + selectedIngredient.step)}
                                            class="w-12 h-12 bg-white rounded-lg border border-slate-200 flex items-center justify-center text-xl font-bold active:bg-slate-100 shadow-sm select-none"
                                        >
                                            ＋
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div class="px-4">
                        {result ? (
                            <div class={`p-5 rounded-2xl shadow-md border text-center transition-all ${mode === 'microwave' ? 'bg-blue-50 border-blue-100' : 'bg-orange-50 border-orange-100'}`}>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">調理目安</p>
                                <div class="flex items-baseline justify-center space-x-2 my-2">
                                    <span class="text-xl font-bold text-slate-700">{result.watt}</span>
                                    <span class="text-slate-400">で</span>
                                    <span class="text-3xl font-black text-slate-900 tracking-tight">{result.time}</span>
                                </div>
                                {result.note && (
                                    <p class="text-xs text-slate-600 bg-white/80 rounded-xl p-3 text-left mt-3 leading-relaxed border border-dashed border-slate-200">
                                        💡 {result.note}
                                    </p>
                                )}
                            </div>
                        ) : (
                            <div class="p-5 bg-slate-100 rounded-2xl text-center text-slate-400 text-sm">
                                条件を選択してください
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = React.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
